<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quilombo Digital | UNEGRO Vale do Paraíba</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/scrollreveal"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@300;400;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --ouro-velho: #d4af37;
            --laranja-ancestral: #ff8c00;
            --preto-profundo: #050505;
            --cinza-quilombo: #0a0a0a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--preto-profundo);
            color: #fff;
            font-family: 'Inter', sans-serif;
            /* Background com textura mais densa e ancestral */
            background-image: radial-gradient(circle at 50% 50%, rgba(20, 20, 20, 0.8), rgba(0, 0, 0, 1)), 
            url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><g fill="%23151515" fill-opacity="0.4"><path d="M0 0 L50 50 L100 0 V100 L50 50 L0 100 Z"/></g></svg>');
            background-attachment: fixed;
            overflow-x: hidden;
        }

        /* Nav com Identidade Forte */
        .nav-unegro {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 50px; background: rgba(0,0,0,0.9); backdrop-filter: blur(20px);
            position: fixed; top: 0; width: 100%; z-index: 1000; border-bottom: 2px solid var(--laranja-ancestral);
        }
        .nav-logo { display: flex; align-items: center; gap: 20px; }
        .nav-logo img { height: 55px; filter: drop-shadow(0 0 5px rgba(255,140,0,0.3)); }
        .nav-tagline { font-family: 'Syncopate', sans-serif; font-size: 10px; letter-spacing: 3px; color: var(--laranja-ancestral); font-weight: 700; text-transform: uppercase; border-left: 1px solid #333; padding-left: 20px; }

        /* Header Quilombola */
        .quilombo-header {
            padding: 180px 20px 80px;
            max-width: 900px;
            margin: auto;
            text-align: center;
        }
        .quilombo-header h1 {
            font-family: 'Syncopate', sans-serif;
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: -2px;
            line-height: 0.9;
            margin-bottom: 20px;
            background: linear-gradient(to bottom, #fff, var(--laranja-ancestral));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .quilombo-header p {
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: 600;
        }

        /* Filtros Conceituais */
        .territorios-filtros {
            display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-bottom: 60px; padding: 0 20px;
        }
        .filtro-item {
            background: transparent;
            border: 1px solid #222;
            color: #555;
            padding: 12px 25px;
            border-radius: 0px; /* Quadrado traz mais rigidez e força */
            cursor: pointer;
            font-size: 10px;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 2px;
            transition: 0.5s;
        }
        .filtro-item:hover, .filtro-item.active {
            border-color: var(--laranja-ancestral);
            color: #fff;
            background: rgba(255, 140, 0, 0.05);
        }

        /* Grid de Saberes */
        .quilombo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 40px;
            max-width: 1300px;
            margin: auto;
            padding: 0 40px 100px;
        }

        .card-quilombola {
            background: var(--cinza-quilombo);
            border-left: 4px solid #1a1a1a;
            padding: 30px;
            position: relative;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card-quilombola:hover {
            border-left-color: var(--laranja-ancestral);
            background: #0f0f0f;
            transform: scale(1.02);
        }
        .card-quilombola::before {
            content: "OFÍCIO";
            position: absolute; top: 15px; right: 20px;
            font-size: 8px; color: #333; font-weight: 900; letter-spacing: 2px;
        }

        .oficio-tag {
            font-size: 10px;
            color: var(--laranja-ancestral);
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 10px;
            display: block;
        }
        .filiado-nome {
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 5px;
            letter-spacing: -1px;
        }
        .servico-titulo {
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
            font-style: italic;
        }
        .servico-desc {
            color: #555;
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn-quilombo {
            border: 1px solid var(--laranja-ancestral);
            color: var(--laranja-ancestral);
            text-decoration: none;
            text-align: center;
            padding: 15px;
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.3s;
        }
        .btn-quilombo:hover {
            background: var(--laranja-ancestral);
            color: #000;
        }

        @media (max-width: 768px) {
            .nav-unegro { padding: 15px 20px; }
            .nav-tagline { display: none; }
            .quilombo-grid { padding: 0 20px 100px; }
        }
    </style>
</head>
<body>

    <nav class="nav-unegro">
        <div class="nav-logo">
            <img src="https://unegroes.org.br/wp-content/uploads/2024/12/UNEGRO-LOGO-e1734363397338.png" alt="UNEGRO">
            <span class="nav-tagline">Vale do Paraíba</span>
        </div>
        <div style="display: flex; gap: 25px;">
            <a href="index.html" style="color: #444; text-decoration: none; font-size: 10px; font-weight: 900; text-transform: uppercase;">Início</a>
            <a href="https://instagram.com/unegrovale" style="color: var(--laranja-ancestral); text-decoration: none; font-size: 10px; font-weight: 900; text-transform: uppercase;">Instagram</a>
        </div>
    </nav>

    <div class="quilombo-header">
        <p>Rede de Prosperidade Compartilhada</p>
        <h1>Quilombo Digital</h1>
        <div style="width: 60px; height: 2px; background: var(--laranja-ancestral); margin: 30px auto;"></div>
    </div>

    <div class="territorios-filtros">
        <button class="filtro-item active" onclick="filtrar('Todos', this)">Todos os Saberes</button>
        <button class="filtro-item" onclick="filtrar('Tecnologia', this)">Tecnologia</button>
        <button class="filtro-item" onclick="filtrar('Estética', this)">Estética & Identidade</button>
        <button class="filtro-item" onclick="filtrar('Saúde', this)">Bem-Estar & Saúde</button>
        <button class="filtro-item" onclick="filtrar('Educação', this)">Educação & Saber</button>
    </div>

    <div id="quilombo-lista" class="quilombo-grid">
        </div>

    <script>
        const CONFIG = {
            URL: 'https://huxemmuzhlntwimgiukt.supabase.co',
            KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh1eGVtbXV6aGxudHdpbWdpdWt0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3NzAyMDYsImV4cCI6MjA5MDM0NjIwNn0.Y85R3XQ9w4vMUGiH9zNmwpFpEj6jRPHc7lSjyYN_VVs'
        };
        const _supabase = supabase.createClient(CONFIG.URL, CONFIG.KEY);

        let saberesData = [];

        async function carregarQuilombo() {
            const { data, error } = await _supabase.from('unegro_servicos').select('*').order('filiado_nome');
            if (!error) {
                saberesData = data;
                render(saberesData);
            }
        }

        function filtrar(cat, btn) {
            document.querySelectorAll('.filtro-item').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            const filtrados = (cat === 'Todos') ? saberesData : saberesData.filter(s => s.categoria === cat);
            render(filtrados);
        }

        function render(lista) {
            const container = document.getElementById('quilombo-lista');
            container.innerHTML = lista.map(s => `
                <div class="card-quilombola">
                    <div>
                        <span class="oficio-tag">${s.categoria} • ${s.cidade}</span>
                        <h2 class="filiado-nome">${s.filiado_nome}</h2>
                        <div class="servico-titulo">${s.titulo_servico}</div>
                        <p class="servico-desc">${s.descricao}</p>
                    </div>
                    <a href="https://wa.me/${s.whatsapp}" target="_blank" class="btn-quilombo">Fortalecer esse Elo</a>
                </div>
            `).join('');
            
            ScrollReveal().reveal('.card-quilombola', { interval: 100, scale: 0.9, opacity: 0 });
        }

        window.onload = carregarQuilombo;
    </script>
</body>
</html>
