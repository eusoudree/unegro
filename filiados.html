<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADM | UNEGRO Vale do Paraíba</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
:root { --gold:#f1b434; --red:#8b0000; --black:#0a0a0a; --gray:#1a1a1a; }

body {
    font-family:'Inter', sans-serif;
    background:var(--black);
    color:white;
    margin:0;
    display:flex;
    flex-direction:column;
    min-height:100vh;
}

/* Login */
#login-screen {
    position:fixed;
    inset:0;
    background:var(--black);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:1000;
}

.login-box {
    background:var(--gray);
    padding:40px;
    border-radius:12px;
    border:1px solid var(--gold);
    text-align:center;
    width:300px;
}

.login-box input {
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:6px;
    background:#000;
    color:#fff;
    border:1px solid #333;
}

/* Admin */
#admin-content {
    display:none;
    padding:40px;
    max-width:1200px;
    margin:0 auto;
}

header {
    border-bottom:2px solid var(--gold);
    margin-bottom:30px;
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:20px;
}

h1 { color:var(--gold); margin:0; }

.filter-group {
    display:flex;
    flex-direction:column;
    gap:5px;
    background:#000;
    padding:10px;
    border-radius:8px;
    border:1px solid #333;
}

select {
    background:#000;
    color:var(--gold);
    border:none;
    padding:8px;
    font-weight:bold;
    outline:none;
    cursor:pointer;
}

/* tabela */
table {
    width:100%;
    border-collapse:collapse;
    background:var(--gray);
}

th {
    background:#252525;
    color:var(--gold);
    padding:15px;
    font-size:11px;
}

td {
    padding:15px;
    border-bottom:1px solid #333;
    font-size:13px;
}

tr:hover { background:#222; }

.btn {
    cursor:pointer;
    border:none;
    border-radius:4px;
    padding:8px 14px;
    font-weight:700;
    font-size:10px;
}

.btn-gold { background:var(--gold); color:#000; }
.btn-outline-red { border:1px solid #441111; color:#ff4444; background:none; }

.stats-card {
    background:var(--gray);
    padding:20px;
    margin-bottom:20px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login-screen">
    <div class="login-box">
        <h2 style="color:var(--gold)">Restrito</h2>
        <input type="text" id="user" placeholder="Usuário">
        <input type="password" id="pass" placeholder="Senha">
        <button class="btn btn-gold" onclick="checkLogin()">Entrar</button>
        <p id="error-msg" style="color:red;display:none;">Credenciais inválidas</p>
    </div>
</div>

<!-- ADMIN -->
<div id="admin-content">
<header>
    <div>
        <h1>Gestão de Filiados</h1>
        <small>UNEGRO VALE DO PARAÍBA</small>
    </div>

    <div class="filter-group">
        <label>Filtrar cidades</label>

        <select id="cityFilter" multiple onchange="applyFilter()" style="height:100px;">
        </select>

        <label style="font-size:11px;">
            <input type="checkbox" id="excludeMode" onchange="applyFilter()">
            Excluir selecionadas
        </label>
    </div>

    <button class="btn btn-gold" onclick="generateAllPDFs()">Gerar PDFs</button>
</header>

<div class="stats-card">
    <span id="counter">Carregando...</span>
</div>

<table>
<thead>
<tr>
<th>Nome</th>
<th>Cidade</th>
<th>WhatsApp</th>
<th>Raça</th>
<th>Ações</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
</div>

<script>
const CONFIG = {
URL:'https://huxemmuzhlntwimgiukt.supabase.co',
KEY:'SUA_KEY_AQUI'
};

const _supabase = supabase.createClient(CONFIG.URL, CONFIG.KEY);

let fullDataList = [];
let filteredDataList = [];

function checkLogin(){
    const u=document.getElementById('user').value;
    const p=document.getElementById('pass').value;

    if(u==='unegro' && p==='Unegr0Vale!'){
        document.getElementById('login-screen').style.display='none';
        document.getElementById('admin-content').style.display='block';
        loadData();
    } else {
        document.getElementById('error-msg').style.display='block';
    }
}

async function loadData(){
    const {data} = await _supabase
    .from('unegro_filiados')
    .select('*')
    .order('nome',{ascending:true});

    fullDataList = data;
    populateCityFilter(data);
    applyFilter();
}

function populateCityFilter(list){
    const select=document.getElementById('cityFilter');
    const cities=[...new Set(list.map(i=>i.cidade))].sort();

    select.innerHTML='';
    cities.forEach(c=>{
        if(c) select.innerHTML+=`<option value="${c}">${c}</option>`;
    });
}

function applyFilter(){
    const select=document.getElementById('cityFilter');
    const selected=[...select.selectedOptions].map(o=>o.value);
    const exclude=document.getElementById('excludeMode').checked;

    if(selected.length===0){
        filteredDataList=fullDataList;
    } else if(exclude){
        filteredDataList=fullDataList.filter(i=>!selected.includes(i.cidade));
    } else {
        filteredDataList=fullDataList.filter(i=>selected.includes(i.cidade));
    }

    render(filteredDataList);
}

function render(list){
    document.getElementById('counter').innerText=`${list.length} registros`;

    document.getElementById('tableBody').innerHTML = list.map(i=>`
    <tr>
        <td>${i.nome}</td>
        <td>${i.cidade}</td>
        <td>${i.whatsapp||''}</td>
        <td>${i.raca||''}</td>
        <td>
            <button class="btn btn-gold" onclick='generateSinglePDF(${JSON.stringify(i)})'>PDF</button>
        </td>
    </tr>
    `).join('');
}

function generateSinglePDF(item){
    const {jsPDF}=window.jspdf;
    const doc=new jsPDF();
    doc.text(item.nome,20,20);
    window.open(doc.output('bloburl'));
}

function generateAllPDFs(){
    const {jsPDF}=window.jspdf;
    const doc=new jsPDF();

    filteredDataList.forEach((i,idx)=>{
        doc.text(i.nome,20,20);
        if(idx<filteredDataList.length-1) doc.addPage();
    });

    window.open(doc.output('bloburl'));
}
</script>

</body>
</html>
