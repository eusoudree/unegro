<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão | Saberes Quilombo Digital</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --gold: #f1b434; --red: #8b0000; --black: #0a0a0a; --gray: #1a1a1a; }
        body { font-family: 'Inter', sans-serif; background: var(--black); color: white; margin: 0; min-height: 100vh; }

        /* Login Overlay */
        #login-screen { position: fixed; inset: 0; background: var(--black); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .login-box { background: var(--gray); padding: 40px; border-radius: 12px; border: 1px solid var(--gold); text-align: center; width: 300px; }
        .login-box input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid #333; background: #000; color: #fff; box-sizing: border-box; }

        /* Dashboard */
        #admin-content { display: none; padding: 40px; max-width: 1100px; margin: 0 auto; }
        header { border-bottom: 2px solid var(--gold); margin-bottom: 30px; display: flex; justify-content: space-between; align-items: flex-end; padding-bottom: 15px; }
        
        /* Formulário */
        .form-section { background: var(--gray); padding: 25px; border-radius: 8px; margin-bottom: 30px; border: 1px solid #222; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-size: 10px; color: var(--gold); font-weight: bold; text-transform: uppercase; }
        .form-group input, .form-group select, .form-group textarea { background: #000; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 4px; font-family: inherit; }
        textarea { grid-column: span 2; height: 80px; resize: none; }

        /* Tabela */
        table { width: 100%; border-collapse: collapse; background: var(--gray); border-radius: 8px; overflow: hidden; margin-top: 20px; }
        th { background: #252525; color: var(--gold); padding: 15px; text-align: left; font-size: 11px; text-transform: uppercase; }
        td { padding: 15px; border-bottom: 1px solid #333; font-size: 13px; }
        
        .btn { cursor: pointer; border: none; border-radius: 4px; padding: 10px 18px; font-weight: 700; text-transform: uppercase; font-size: 10px; transition: 0.2s; }
        .btn-gold { background: var(--gold); color: #000; }
        .btn-outline { background: transparent; border: 1px solid #444; color: #aaa; }
        .btn-red { background: var(--red); color: white; }
        .btn:hover { opacity: 0.8; transform: translateY(-1px); }

        .tag-categoria { background: #333; padding: 3px 8px; border-radius: 4px; font-size: 10px; color: var(--gold); font-weight: bold; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2 style="color: var(--gold);">Quilombo Digital</h2>
            <input type="text" id="user" placeholder="Usuário">
            <input type="password" id="pass" placeholder="Senha">
            <button class="btn btn-gold" style="width: 100%;" onclick="checkLogin()">Entrar</button>
            <p id="error-msg" style="color: var(--red); font-size: 11px; margin-top: 10px; display: none;">Credenciais inválidas.</p>
        </div>
    </div>

    <div id="admin-content">
        <header>
            <div>
                <h1 style="color: var(--gold); margin: 0;">Gestão de Saberes</h1>
                <small style="color: #666;">CATÁLOGO DE SERVIÇOS E PROSPERIDADE COMPARTILHADA</small>
            </div>
            <button class="btn btn-outline" onclick="location.reload()">Sair</button>
        </header>

        <div class="form-section">
            <h3 id="form-title" style="margin-top: 0; color: #fff;">Cadastrar Novo Serviço/Saber</h3>
            <input type="hidden" id="service-id">
            <div class="form-grid">
                <div class="form-group">
                    <label>Título do Serviço</label>
                    <input type="text" id="titulo" placeholder="Ex: Consultoria Tech">
                </div>
                <div class="form-group">
                    <label>Categoria</label>
                    <select id="categoria">
                        <option value="TECNOLOGIA">TECNOLOGIA</option>
                        <option value="ESTÉTICA & IDENTIDADE">ESTÉTICA & IDENTIDADE</option>
                        <option value="BEM-ESTAR & SAÚDE">BEM-ESTAR & SAÚDE</option>
                        <option value="EDUCAÇÃO & SABER">EDUCAÇÃO & SABER</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Profissional / Responsável</label>
                    <input type="text" id="responsavel">
                </div>
                <div class="form-group">
                    <label>WhatsApp (Link ou Número)</label>
                    <input type="text" id="contato">
                </div>
                <div class="form-group" style="grid-column: span 2;">
                    <label>Descrição do Saber</label>
                    <textarea id="descricao" placeholder="Explique a importância desse serviço para a rede..."></textarea>
                </div>
            </div>
            <div style="margin-top: 20px; display: flex; gap: 10px;">
                <button class="btn btn-gold" id="save-btn" onclick="saveService()">Salvar no Catálogo</button>
                <button class="btn btn-outline" id="cancel-btn" style="display: none;" onclick="resetForm()">Cancelar</button>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Serviço</th>
                    <th>Categoria</th>
                    <th>Responsável</th>
                    <th style="text-align: right;">Ações</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

<script>
    const CONFIG = {
        URL: 'https://huxemmuzhlntwimgiukt.supabase.co',
        KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh1eGVtbXV6aGxudHdpbWdpdWt0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3NzAyMDYsImV4cCI6MjA5MDM0NjIwNn0.Y85R3XQ9w4vMUGiH9zNmwpFpEj6jRPHc7lSjyYN_VVs'
    };

    const _supabase = supabase.createClient(CONFIG.URL, CONFIG.KEY);
    let listServices = [];

    function checkLogin() {
        const u = document.getElementById('user').value.trim();
        const p = document.getElementById('pass').value.trim();

        if(u === 'unegrosp' && p === 'UnegroSP2026!') {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('admin-content').style.display = 'block';
            fetchServices();
        } else {
            document.getElementById('error-msg').style.display = 'block';
        }
    }

    async function fetchServices() {
        const { data, error } = await _supabase
            .from('quilombo_servicos') // Certifique-se que o nome da tabela no Supabase é este
            .select('*')
            .order('titulo', { ascending: true });

        if (error) return console.error(error);
        listServices = data;
        render();
    }

    function render() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = listServices.map(item => `
            <tr>
                <td><b>${item.titulo.toUpperCase()}</b></td>
                <td><span class="tag-categoria">${item.categoria}</span></td>
                <td>${item.responsavel || '---'}</td>
                <td style="text-align: right; display: flex; gap: 8px; justify-content: flex-end;">
                    <button class="btn btn-outline" onclick='editMode(${JSON.stringify(item)})'>Editar</button>
                    <button class="btn btn-red" onclick="deleteService('${item.id}', '${item.titulo}')">Excluir</button>
                </td>
            </tr>
        `).join('');
    }

    async function saveService() {
        const id = document.getElementById('service-id').value;
        const payload = {
            titulo: document.getElementById('titulo').value,
            categoria: document.getElementById('categoria').value,
            responsavel: document.getElementById('responsavel').value,
            contato: document.getElementById('contato').value,
            descricao: document.getElementById('descricao').value
        };

        if(!payload.titulo) return alert("Título é obrigatório.");

        let res;
        if(id) {
            res = await _supabase.from('quilombo_servicos').update(payload).eq('id', id);
        } else {
            res = await _supabase.from('quilombo_servicos').insert([payload]);
        }

        if(res.error) {
            alert("Erro ao processar.");
        } else {
            resetForm();
            fetchServices();
        }
    }

    function editMode(item) {
        document.getElementById('form-title').innerText = "Editando Saber";
        document.getElementById('service-id').value = item.id;
        document.getElementById('titulo').value = item.titulo;
        document.getElementById('categoria').value = item.categoria;
        document.getElementById('responsavel').value = item.responsavel;
        document.getElementById('contato').value = item.contato;
        document.getElementById('descricao').value = item.descricao;
        
        document.getElementById('cancel-btn').style.display = "inline-block";
        document.getElementById('save-btn').innerText = "Atualizar Saber";
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
        document.getElementById('form-title').innerText = "Cadastrar Novo Serviço/Saber";
        document.getElementById('service-id').value = "";
        const fields = ['titulo', 'responsavel', 'contato', 'descricao'];
        fields.forEach(f => document.getElementById(f).value = "");
        document.getElementById('cancel-btn').style.display = "none";
        document.getElementById('save-btn').innerText = "Salvar no Catálogo";
    }

    async function deleteService(id, titulo) {
        if(!confirm(`Remover "${titulo}" do catálogo?`)) return;
        const { error } = await _supabase.from('quilombo_servicos').delete().eq('id', id);
        if(!error) fetchServices();
    }
</script>
</body>
</html>
