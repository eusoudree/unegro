<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quilombo Digital | UNEGRO Vale do Paraíba</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Inter:wght@400;900&display=swap" rel="stylesheet">
    
    <style>
        :root { --laranja: #ff8c00; --preto: #050505; --card: #0a0a0a; --texto-muted: #444; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background: var(--preto); color: #fff; font-family: 'Inter', sans-serif; 
            background-image: linear-gradient(rgba(0,0,0,0.9), rgba(0,0,0,0.95)), url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 100 100"><path d="M50 20 L40 35 H60 Z" fill="%231a1a1a"/></svg>');
            padding-top: 100px; background-attachment: fixed;
        }

        .nav-unegro { 
            display: flex; justify-content: space-between; align-items: center; padding: 15px 50px; 
            background: rgba(0,0,0,0.9); backdrop-filter: blur(15px); position: fixed; top: 0; width: 100%; z-index: 1000; border-bottom: 2px solid var(--laranja); 
        }

        .header-quilombo { text-align: center; padding: 60px 20px 40px; }
        .header-quilombo h1 { font-family: 'Syncopate', sans-serif; font-size: clamp(2rem, 5vw, 3rem); text-transform: uppercase; margin-bottom: 10px; }

        /* BUSCA E CONTROLES */
        .controls-area { max-width: 1200px; margin: 0 auto 50px; padding: 0 20px; text-align: center; }
        
        .search-box { position: relative; max-width: 500px; margin: 0 auto 30px; }
        .search-box input {
            width: 100%; background: #000; border: 1px solid #222; border-radius: 50px; 
            padding: 15px 25px; color: #fff; font-size: 13px; outline: none; transition: 0.4s; text-align: center;
        }
        .search-box input:focus { border-color: var(--laranja); }

        .filter-group { margin-bottom: 20px; }
        .label-filtro { font-size: 9px; text-transform: uppercase; letter-spacing: 2px; color: var(--texto-muted); margin-bottom: 10px; display: block; font-weight: 800; }

        .btn-filtro { 
            background: transparent; border: 1px solid #1a1a1a; color: #555; padding: 8px 18px; 
            text-transform: uppercase; font-size: 9px; font-weight: 800; cursor: pointer; transition: 0.3s; margin: 3px;
        }
        .btn-filtro.active { border-color: var(--laranja); color: #fff; background: rgba(255,140,0,0.05); }

        /* GRID */
        .grid-quilombo { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; max-width: 1200px; margin: auto; padding: 0 20px 100px; }
        
        .card-oficio { 
            background: var(--card); border-left: 4px solid #1a1a1a; padding: 35px; 
            transition: 0.3s; display: flex; flex-direction: column; justify-content: space-between;
        }
        .card-oficio:hover { border-left-color: var(--laranja); transform: translateY(-5px); background: #0f0f0f; }
        
        .cat-tag { color: var(--laranja); font-size: 9px; font-weight: 800; text-transform: uppercase; margin-bottom: 10px; display: block; }
        .nome-filiado { font-size: 22px; font-weight: 900; margin-bottom: 5px; }
        .titulo-trabalho { color: #555; font-size: 13px; margin-bottom: 20px; font-weight: 700; text-transform: uppercase; }
        .descricao { font-size: 13px; color: #888; line-height: 1.7; margin-bottom: 30px; }
        
        .btn-fortalecer { 
            border: 1px solid var(--laranja); color: var(--laranja); text-align: center; 
            padding: 15px; text-decoration: none; font-size: 10px; font-weight: 900; text-transform: uppercase; transition: 0.3s;
        }
        .btn-fortalecer:hover { background: var(--laranja); color: #000; }

        @media (max-width: 768px) {
            .nav-unegro { padding: 15px 25px; }
            .header-quilombo h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <nav class="nav-unegro">
        <img src="https://unegroes.org.br/wp-content/uploads/2024/12/UNEGRO-LOGO-e1734363397338.png" height="50">
        <div style="font-size: 10px; font-weight: 900; letter-spacing: 2px; color: var(--laranja);">VALE DO PARAÍBA</div>
    </nav>

    <div class="header-quilombo">
        <h1>Quilombo Digital</h1>
        <p style="color: #333; letter-spacing: 4px; text-transform: uppercase; font-size: 9px;">Território de Saberes e Ofícios</p>
    </div>

    <div class="controls-area">
        <div class="search-box">
            <input type="text" id="campoBusca" placeholder="BUSCAR POR NOME OU OFÍCIO..." oninput="executarFiltro()">
        </div>

        <div class="filter-group">
            <span class="label-filtro">Territórios (Cidades)</span>
            <div id="filtros-cidade">
                <button class="btn-filtro active" onclick="setCidade('Todas', this)">Todas</button>
            </div>
        </div>

        <div class="filter-group">
            <span class="label-filtro">Saberes (Categorias)</span>
            <div id="filtros-categoria">
                <button class="btn-filtro active" onclick="setCategoria('Todos', this)">Todos</button>
            </div>
        </div>
    </div>

    <div id="grid-saberes" class="grid-quilombo"></div>

    <script>
        const CONFIG = {
            URL: 'https://huxemmuzhlntwimgiukt.supabase.co',
            KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh1eGVtbXV6aGxudHdpbWdpdWt0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3NzAyMDYsImV4cCI6MjA5MDM0NjIwNn0.Y85R3XQ9w4vMUGiH9zNmwpFpEj6jRPHc7lSjyYN_VVs'
        };
        const _supabase = supabase.createClient(CONFIG.URL, CONFIG.KEY);

        let saberes = [];
        let categoriaAtiva = 'Todos';
        let cidadeAtiva = 'Todas';

        async function init() {
            // 1. Puxa Saberes com relações
            const { data: registros } = await _supabase.from('unegro_servicos').select('*, unegro_categorias(nome), unegro_subcategorias(nome)');
            saberes = registros;

            // 2. Monta Categorias dinâmicas do Banco
            const { data: categorias } = await _supabase.from('unegro_categorias').select('nome').order('ordem');
            const boxCat = document.getElementById('filtros-categoria');
            categorias.forEach(c => boxCat.innerHTML += `<button class="btn-filtro" onclick="setCategoria('${c.nome}', this)">${c.nome}</button>`);

            // 3. Monta Cidades Dinâmicas (Agrupando quem já está cadastrado)
            const cidadesUnicas = [...new Set(saberes.map(s => s.cidade))].filter(Boolean).sort();
            const boxCid = document.getElementById('filtros-cidade');
            cidadesUnicas.forEach(cid => boxCid.innerHTML += `<button class="btn-filtro" onclick="setCidade('${cid}', this)">${cid}</button>`);

            renderizar(saberes);
        }

        function setCategoria(cat, btn) {
            document.querySelectorAll('#filtros-categoria .btn-filtro').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            categoriaAtiva = cat;
            executarFiltro();
        }

        function setCidade(cid, btn) {
            document.querySelectorAll('#filtros-cidade .btn-filtro').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            cidadeAtiva = cid;
            executarFiltro();
        }

        function executarFiltro() {
            const termo = document.getElementById('campoBusca').value.toLowerCase();
            const resultado = saberes.filter(s => {
                const matchesBusca = s.filiado_nome.toLowerCase().includes(termo) || s.titulo_servico.toLowerCase().includes(termo);
                const matchesCat = (categoriaAtiva === 'Todos') || (s.unegro_categorias?.nome === categoriaAtiva);
                const matchesCid = (cidadeAtiva === 'Todas') || (s.cidade === cidadeAtiva);
                return matchesBusca && matchesCat && matchesCid;
            });
            renderizar(resultado);
        }

        function renderizar(lista) {
            const container = document.getElementById('grid-saberes');
            container.innerHTML = lista.map(o => `
                <div class="card-oficio">
                    <div>
                        <span class="cat-tag">${o.unegro_categorias?.nome || 'Geral'} • ${o.cidade}</span>
                        <h2 class="nome-filiado">${o.filiado_nome}</h2>
                        <div class="titulo-trabalho">${o.titulo_servico}</div>
                        <p class="descricao">${o.descricao}</p>
                    </div>
                    <a href="https://wa.me/${o.whatsapp}" target="_blank" class="btn-fortalecer">Fortalecer Elo</a>
                </div>
            `).join('');
        }

        window.onload = init;
    </script>
</body>
</html>
