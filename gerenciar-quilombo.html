<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão | Territórios de AXÉ</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --gold: #f1b434; --red: #8b0000; --black: #0a0a0a; --gray: #1a1a1a; }
        body { font-family: 'Inter', sans-serif; background: var(--black); color: white; margin: 0; min-height: 100vh; }

        /* Login Overlay */
        #login-screen { position: fixed; inset: 0; background: var(--black); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .login-box { background: var(--gray); padding: 40px; border-radius: 12px; border: 1px solid var(--gold); text-align: center; width: 300px; }
        .login-box input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid #333; background: #000; color: #fff; box-sizing: border-box; }

        /* Dashboard */
        #admin-content { display: none; padding: 40px; max-width: 1100px; margin: 0 auto; }
        header { border-bottom: 2px solid var(--gold); margin-bottom: 30px; display: flex; justify-content: space-between; align-items: flex-end; padding-bottom: 15px; }
        
        /* Formulário de Cadastro/Edição */
        .form-section { background: var(--gray); padding: 25px; border-radius: 8px; margin-bottom: 30px; border: 1px solid #222; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-size: 10px; color: var(--gold); font-weight: bold; text-transform: uppercase; }
        .form-group input, .form-group textarea { background: #000; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 4px; font-family: inherit; }
        textarea { grid-column: span 2; height: 80px; resize: none; }

        /* Tabela */
        table { width: 100%; border-collapse: collapse; background: var(--gray); border-radius: 8px; overflow: hidden; margin-top: 20px; }
        th { background: #252525; color: var(--gold); padding: 15px; text-align: left; font-size: 11px; text-transform: uppercase; }
        td { padding: 15px; border-bottom: 1px solid #333; font-size: 13px; }
        
        .btn { cursor: pointer; border: none; border-radius: 4px; padding: 10px 18px; font-weight: 700; text-transform: uppercase; font-size: 10px; transition: 0.2s; }
        .btn-gold { background: var(--gold); color: #000; }
        .btn-outline { background: transparent; border: 1px solid #444; color: #aaa; }
        .btn-red { background: var(--red); color: white; }
        .btn:hover { opacity: 0.8; transform: translateY(-1px); }

        .actions { display: flex; gap: 8px; justify-content: flex-end; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2 style="color: var(--gold);">Gestão AXÉ</h2>
            <input type="text" id="user" placeholder="Usuário">
            <input type="password" id="pass" placeholder="Senha">
            <button class="btn btn-gold" style="width: 100%;" onclick="checkLogin()">Entrar</button>
            <p id="error-msg" style="color: var(--red); font-size: 11px; margin-top: 10px; display: none;">Credenciais inválidas.</p>
        </div>
    </div>

    <div id="admin-content">
        <header>
            <div>
                <h1 style="color: var(--gold); margin: 0;">Mapeamento Ancestral</h1>
                <small style="color: #666;">CADASTRO DE TERRITÓRIOS DE AXÉ - VALE DO PARAÍBA</small>
            </div>
            <button class="btn btn-outline" onclick="location.reload()">Sair</button>
        </header>

        <div class="form-section">
            <h3 id="form-title" style="margin-top: 0; color: #fff;">Cadastrar Novo Terreiro</h3>
            <input type="hidden" id="entry-id">
            <div class="form-grid">
                <div class="form-group">
                    <label>Nome do Terreiro</label>
                    <input type="text" id="nome">
                </div>
                <div class="form-group">
                    <label>Zelador(a)</label>
                    <input type="text" id="zelador">
                </div>
                <div class="form-group">
                    <label>Endereço</label>
                    <input type="text" id="endereco">
                </div>
                <div class="form-group">
                    <label>Cidade</label>
                    <input type="text" id="cidade">
                </div>
                <div class="form-group">
                    <label>Instagram (URL)</label>
                    <input type="text" id="instagram_url">
                </div>
                <div class="form-group">
                    <label>Foto (URL)</label>
                    <input type="text" id="foto_url">
                </div>
                <div class="form-group" style="grid-column: span 2;">
                    <label>Biografia / História</label>
                    <textarea id="biografia"></textarea>
                </div>
            </div>
            <div style="margin-top: 20px; display: flex; gap: 10px;">
                <button class="btn btn-gold" id="save-btn" onclick="saveData()">Salvar Registro</button>
                <button class="btn btn-outline" id="cancel-btn" style="display: none;" onclick="resetForm()">Cancelar Edição</button>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Terreiro</th>
                    <th>Cidade</th>
                    <th>Zelador</th>
                    <th style="text-align: right;">Ações</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

<script>
    const CONFIG = {
        URL: 'https://huxemmuzhlntwimgiukt.supabase.co',
        KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh1eGVtbXV6aGxudHdpbWdpdWt0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3NzAyMDYsImV4cCI6MjA5MDM0NjIwNn0.Y85R3XQ9w4vMUGiH9zNmwpFpEj6jRPHc7lSjyYN_VVs'
    };

    const _supabase = supabase.createClient(CONFIG.URL, CONFIG.KEY);
    let listData = [];

    function checkLogin() {
        const u = document.getElementById('user').value.trim();
        const p = document.getElementById('pass').value.trim();

        if(u === 'unegrosp' && p === 'UnegroSP2026!') {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('admin-content').style.display = 'block';
            fetchData();
        } else {
            document.getElementById('error-msg').style.display = 'block';
        }
    }

    async function fetchData() {
        const { data, error } = await _supabase
            .from('territorios_axe')
            .select('*')
            .order('nome', { ascending: true });

        if (error) return console.error(error);
        listData = data;
        render();
    }

    function render() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = listData.map(item => `
            <tr>
                <td><b>${item.nome.toUpperCase()}</b></td>
                <td><span style="color:#aaa">${item.cidade}</span></td>
                <td>${item.zelador}</td>
                <td class="actions">
                    <button class="btn btn-outline" onclick='editMode(${JSON.stringify(item)})'>Editar</button>
                    <button class="btn btn-red" onclick="deleteEntry('${item.id}', '${item.nome}')">Excluir</button>
                </td>
            </tr>
        `).join('');
    }

    async function saveData() {
        const id = document.getElementById('entry-id').value;
        const payload = {
            nome: document.getElementById('nome').value,
            zelador: document.getElementById('zelador').value,
            endereco: document.getElementById('endereco').value,
            cidade: document.getElementById('cidade').value,
            instagram_url: document.getElementById('instagram_url').value,
            foto_url: document.getElementById('foto_url').value,
            biografia: document.getElementById('biografia').value
        };

        if(!payload.nome || !payload.cidade) return alert("Nome e Cidade são obrigatórios.");

        let result;
        if(id) {
            result = await _supabase.from('territorios_axe').update(payload).eq('id', id);
        } else {
            result = await _supabase.from('territorios_axe').insert([payload]);
        }

        if(result.error) {
            alert("Erro ao salvar.");
        } else {
            resetForm();
            fetchData();
        }
    }

    function editMode(item) {
        document.getElementById('form-title').innerText = "Editando: " + item.nome;
        document.getElementById('entry-id').value = item.id;
        document.getElementById('nome').value = item.nome;
        document.getElementById('zelador').value = item.zelador;
        document.getElementById('endereco').value = item.endereco;
        document.getElementById('cidade').value = item.cidade;
        document.getElementById('instagram_url').value = item.instagram_url;
        document.getElementById('foto_url').value = item.foto_url;
        document.getElementById('biografia').value = item.biografia;
        
        document.getElementById('cancel-btn').style.display = "inline-block";
        document.getElementById('save-btn').innerText = "Atualizar Registro";
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
        document.getElementById('form-title').innerText = "Cadastrar Novo Terreiro";
        document.getElementById('entry-id').value = "";
        const inputs = document.querySelectorAll('.form-grid input, .form-grid textarea');
        inputs.forEach(i => i.value = "");
        document.getElementById('cancel-btn').style.display = "none";
        document.getElementById('save-btn').innerText = "Salvar Registro";
    }

    async function deleteEntry(id, nome) {
        if(!confirm(`Excluir permanentemente ${nome}?`)) return;
        const { error } = await _supabase.from('territorios_axe').delete().eq('id', id);
        if(!error) fetchData();
    }
</script>
</body>
</html>
