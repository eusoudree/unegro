<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão | Quilombo Digital UNEGRO</title>
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --laranja: #ff8c00; 
            --preto: #050505; 
            --card: #0f0f0f; 
            --borda: #222;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background: var(--preto); color: #fff; font-family: 'Inter', sans-serif; 
            padding-top: 100px; padding-bottom: 100px;
        }

        .nav-unegro { 
            display: flex; justify-content: space-between; align-items: center; padding: 20px 50px; 
            background: rgba(0,0,0,0.95); position: fixed; top: 0; width: 100%; z-index: 1000; border-bottom: 1px solid var(--borda);
        }
        .nav-logo { font-family: 'Syncopate', sans-serif; font-size: 14px; color: #fff; letter-spacing: 2px; }
        .nav-logo span { color: var(--laranja); }
        
        .nav-actions { display: none; gap: 20px; align-items: center; } /* Escondido por padrão */
        .btn-acao { background: transparent; border: none; color: #888; text-decoration: none; font-size: 11px; text-transform: uppercase; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .btn-acao:hover { color: var(--laranja); }

        /* Login Container */
        #loginContainer { max-width: 400px; margin: 60px auto; background: var(--card); padding: 40px; border: 1px solid var(--borda); border-radius: 4px; text-align: center; display: none; }
        
        /* Admin Container */
        .admin-container { max-width: 1200px; margin: 0 auto; padding: 0 20px; display: none; grid-template-columns: 1fr 2fr; gap: 40px; } /* Escondido por padrão, usa grid quando visível */

        .admin-box { background: var(--card); padding: 40px; border: 1px solid var(--borda); border-radius: 4px; }
        .box-title { font-family: 'Syncopate', sans-serif; font-size: 18px; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 1px; color: var(--laranja); border-bottom: 1px solid var(--borda); padding-bottom: 15px; }
        
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-label { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: #666; margin-bottom: 8px; font-weight: 700; }
        .form-input, .form-select, .form-textarea { 
            width: 100%; background: #000; border: 1px solid var(--borda); color: #fff; 
            padding: 15px; font-size: 13px; font-family: 'Inter', sans-serif; outline: none; transition: 0.3s;
        }
        .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--laranja); }
        .form-textarea { resize: vertical; min-height: 100px; }

        .btn-submit { 
            width: 100%; background: var(--laranja); color: #000; border: none; padding: 15px; 
            font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .btn-submit:hover { background: #fff; }
        .btn-clear { width: 100%; background: transparent; border: 1px solid var(--borda); color: #666; padding: 15px; font-size: 10px; font-weight: 700; text-transform: uppercase; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn-clear:hover { color: #fff; border-color: #fff; }

        .table-responsive { overflow-x: auto; }
        .admin-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 12px; }
        .admin-table th { background: #000; padding: 15px; color: var(--laranja); text-transform: uppercase; letter-spacing: 1px; font-size: 10px; border-bottom: 1px solid var(--borda); }
        .admin-table td { padding: 15px; border-bottom: 1px solid var(--borda); color: #ccc; }
        .admin-table tr:hover td { background: #111; }
        
        .action-btn { background: transparent; border: none; cursor: pointer; font-size: 11px; text-transform: uppercase; font-weight: 800; margin-right: 15px; transition: 0.3s; }
        .btn-edit { color: #4facfe; }
        .btn-edit:hover { color: #fff; }
        .btn-delete { color: #ff4d4d; }
        .btn-delete:hover { color: #fff; }

        @media (max-width: 900px) {
            .admin-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <nav class="nav-unegro">
        <div class="nav-logo">GESTOR <span>QUILOMBO</span></div>
        <div class="nav-actions" id="navActions">
            <a href="quilombo-digital.html" class="btn-acao">Ver Catálogo</a>
            <button onclick="logout()" class="btn-acao" style="color: #ff4d4d;">Sair da Conta</button>
        </div>
    </nav>

    <!-- Tela de Login Integrada -->
    <div id="loginContainer">
        <h2 class="box-title" style="border:none; padding:0; margin-bottom: 25px;">Acesso Restrito</h2>
        <form onsubmit="fazerLogin(event)">
            <div class="form-group">
                <label class="form-label">Usuário</label>
                <input type="text" id="loginUsuario" class="form-input" required>
            </div>
            <div class="form-group">
                <label class="form-label">Senha</label>
                <input type="password" id="loginSenha" class="form-input" required>
            </div>
            <button type="submit" class="btn-submit" id="btnEntrar">Acessar Gestão</button>
        </form>
    </div>

    <!-- Painel de Gestão -->
    <div class="admin-container" id="adminContainer">
        
        <!-- Formulário -->
        <div class="admin-box">
            <h2 class="box-title" id="formTitle">Novo Saber</h2>
            <form id="formServico" onsubmit="handleFormSubmit(event)">
                <input type="hidden" id="servicoId">

                <div class="form-group">
                    <label class="form-label">Nome do Filiado</label>
                    <input type="text" id="filiadoNome" class="form-input" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Título do Trabalho / Ofício</label>
                    <input type="text" id="tituloServico" class="form-input" placeholder="Ex: Desenvolvedor Web Sênior" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Território (Cidade SP)</label>
                    <!-- Select Dinâmico do IBGE -->
                    <select id="cidade" class="form-select" required>
                        <option value="">Carregando cidades...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">WhatsApp (Apenas Números)</label>
                    <input type="text" id="whatsapp" class="form-input" placeholder="5512999999999" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Categoria Principal</label>
                    <!-- Puxa direto da Tabela unegro_categorias -->
                    <select id="categoriaSelect" class="form-select" onchange="loadSubcategorias(this.value)" required>
                        <option value="">Carregando categorias...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Subcategoria</label>
                    <!-- Puxa direto da Tabela unegro_subcategorias -->
                    <select id="subcategoriaSelect" class="form-select" required>
                        <option value="">Selecione a categoria primeiro...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Resumo do Serviço</label>
                    <textarea id="descricao" class="form-textarea" required></textarea>
                </div>

                <button type="submit" class="btn-submit" id="btnSalvar">Salvar Registro</button>
                <button type="button" class="btn-clear" onclick="resetForm()">Limpar / Cancelar Edição</button>
            </form>
        </div>

        <!-- Tabela -->
        <div class="admin-box">
            <h2 class="box-title">Registros Ativos</h2>
            <div class="table-responsive">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Filiado</th>
                            <th>Ofício</th>
                            <th>Cidade</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Dados Dinâmicos -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        const CONFIG = {
            URL: 'https://huxemmuzhlntwimgiukt.supabase.co',
            KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh1eGVtbXV6aGxudHdpbWdpdWt0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3NzAyMDYsImV4cCI6MjA5MDM0NjIwNn0.Y85R3XQ9w4vMUGiH9zNmwpFpEj6jRPHc7lSjyYN_VVs'
        };
        const _supabase = supabase.createClient(CONFIG.URL, CONFIG.KEY);

        // 1. LÓGICA DE LOGIN INTEGRADA
        async function fazerLogin(event) {
            event.preventDefault();
            const u = document.getElementById('loginUsuario').value;
            const p = document.getElementById('loginSenha').value;
            const btn = document.getElementById('btnEntrar');
            
            btn.innerText = 'Validando...';

            // Bate na tabela unegro_admins criada
            const { data, error } = await _supabase
                .from('unegro_admins')
                .select('*')
                .eq('usuario', u)
                .eq('senha', p)
                .single();

            if (data) {
                // Sucesso: Grava e roda o checkAuth pra mudar a tela
                localStorage.setItem('unegro_auth_admin', 'ativo');
                checkAuth();
            } else {
                alert('Credenciais incorretas ou usuário não encontrado.');
                console.error(error);
                btn.innerText = 'Acessar Gestão';
            }
        }

        // 2. CONTROLE DE VISIBILIDADE DAS TELAS
        function checkAuth() {
            const authStatus = localStorage.getItem('unegro_auth_admin');
            
            if (authStatus !== 'ativo') {
                // Mostra Login, esconde Admin
                document.getElementById('loginContainer').style.display = 'block';
                document.getElementById('adminContainer').style.display = 'none';
                document.getElementById('navActions').style.display = 'none';
            } else {
                // Esconde Login, mostra Admin
                document.getElementById('loginContainer').style.display = 'none';
                document.getElementById('adminContainer').style.display = 'grid';
                document.getElementById('navActions').style.display = 'flex';
                initDashboard();
            }
        }

        function logout() {
            localStorage.removeItem('unegro_auth_admin');
            document.getElementById('loginUsuario').value = '';
            document.getElementById('loginSenha').value = '';
            document.getElementById('btnEntrar').innerText = 'Acessar Gestão';
            checkAuth(); // Roda de novo pra voltar pra tela de login
        }

        // 3. INICIALIZAÇÃO DO DASHBOARD
        async function initDashboard() {
            await loadCidadesSP();
            await loadCategorias();
            await loadServicos();
        }

        // 4. PUXAR CIDADES DE SÃO PAULO VIA IBGE
        async function loadCidadesSP() {
            try {
                const response = await fetch('https://servicodados.ibge.gov.br/api/v1/localidades/estados/SP/municipios');
                const cidades = await response.json();
                const select = document.getElementById('cidade');
                select.innerHTML = '<option value="">Selecione a cidade...</option>';
                cidades.forEach(c => {
                    select.innerHTML += `<option value="${c.nome}">${c.nome}</option>`;
                });
            } catch (error) {
                console.error("Erro ao carregar cidades do IBGE", error);
                document.getElementById('cidade').innerHTML = '<option value="">Erro ao carregar cidades</option>';
            }
        }

        // 5. PUXAR CATEGORIAS DA BASE DE DADOS
        async function loadCategorias() {
            const { data, error } = await _supabase.from('unegro_categorias').select('*').order('nome');
            if (error) { console.error('Erro nas categorias:', error); return; }
            
            const select = document.getElementById('categoriaSelect');
            select.innerHTML = '<option value="">Selecione a Categoria Principal...</option>';
            data.forEach(cat => {
                select.innerHTML += `<option value="${cat.id}">${cat.nome}</option>`;
            });
        }

        // 6. PUXAR SUBCATEGORIAS CASCATA
        async function loadSubcategorias(categoriaId, preselectedId = null) {
            const select = document.getElementById('subcategoriaSelect');
            select.innerHTML = '<option value="">Carregando...</option>';

            if (!categoriaId) {
                select.innerHTML = '<option value="">Selecione a categoria primeiro...</option>';
                return;
            }

            const { data, error } = await _supabase
                .from('unegro_subcategorias')
                .select('*')
                .eq('categoria_id', categoriaId)
                .order('nome');

            if (error) { console.error('Erro nas subcategorias:', error); return; }

            select.innerHTML = '<option value="">Selecione a Subcategoria...</option>';
            data.forEach(sub => {
                const isSelected = preselectedId == sub.id ? 'selected' : '';
                select.innerHTML += `<option value="${sub.id}" ${isSelected}>${sub.nome}</option>`;
            });
        }

        // 7. CARREGAR TABELA DE SABERES
        async function loadServicos() {
            const { data, error } = await _supabase
                .from('unegro_servicos')
                .select('*, unegro_categorias(nome), unegro_subcategorias(nome)')
                .order('created_at', { ascending: false });

            if (error) { console.error('Erro nos serviços:', error); return; }

            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            data.forEach(item => {
                tbody.innerHTML += `
                    <tr>
                        <td><strong>${item.filiado_nome}</strong></td>
                        <td>${item.titulo_servico}<br><span style="color:#666; font-size:10px;">${item.unegro_categorias?.nome}</span></td>
                        <td>${item.cidade}</td>
                        <td>
                            <button class="action-btn btn-edit" onclick="editServico(${item.id})">Editar</button>
                            <button class="action-btn btn-delete" onclick="deleteServico(${item.id})">Excluir</button>
                        </td>
                    </tr>
                `;
            });
        }

        // 8. SALVAR / ATUALIZAR
        async function handleFormSubmit(event) {
            event.preventDefault();
            const btn = document.getElementById('btnSalvar');
            btn.innerText = 'Salvando...';

            const payload = {
                filiado_nome: document.getElementById('filiadoNome').value,
                titulo_servico: document.getElementById('tituloServico').value,
                cidade: document.getElementById('cidade').value,
                whatsapp: document.getElementById('whatsapp').value,
                categoria_id: document.getElementById('categoriaSelect').value,
                subcategoria_id: document.getElementById('subcategoriaSelect').value,
                descricao: document.getElementById('descricao').value
            };

            const id = document.getElementById('servicoId').value;
            let result;

            if (id) {
                result = await _supabase.from('unegro_servicos').update(payload).eq('id', id);
            } else {
                result = await _supabase.from('unegro_servicos').insert([payload]);
            }

            if (result.error) {
                alert('Erro ao salvar. Verifique permissões do banco (RLS).');
                console.error(result.error);
            } else {
                resetForm();
                loadServicos();
            }
            btn.innerText = 'Salvar Registro';
        }

        // 9. POPULAR FORMULÁRIO (EDITAR)
        async function editServico(id) {
            const { data, error } = await _supabase.from('unegro_servicos').select('*').eq('id', id).single();
            if (error) { console.error(error); return; }

            document.getElementById('formTitle').innerText = 'Editando Saber';
            document.getElementById('servicoId').value = data.id;
            document.getElementById('filiadoNome').value = data.filiado_nome;
            document.getElementById('tituloServico').value = data.titulo_servico;
            document.getElementById('cidade').value = data.cidade;
            document.getElementById('whatsapp').value = data.whatsapp;
            document.getElementById('descricao').value = data.descricao;

            document.getElementById('categoriaSelect').value = data.categoria_id;
            await loadSubcategorias(data.categoria_id, data.subcategoria_id);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 10. EXCLUIR
        async function deleteServico(id) {
            if(confirm('Tem certeza que deseja excluir este registro do Quilombo?')) {
                const { error } = await _supabase.from('unegro_servicos').delete().eq('id', id);
                if (error) { alert('Erro ao excluir.'); console.error(error); }
                else { loadServicos(); }
            }
        }

        function resetForm() {
            document.getElementById('formServico').reset();
            document.getElementById('servicoId').value = '';
            document.getElementById('formTitle').innerText = 'Novo Saber';
            document.getElementById('subcategoriaSelect').innerHTML = '<option value="">Selecione a categoria primeiro...</option>';
        }

        // START: A primeira coisa que a página faz é checar se exibe o login ou o painel.
        window.onload = checkAuth;
    </script>
</body>
</html>
