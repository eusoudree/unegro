<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Ofício | Quilombo Digital</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root { --laranja: #ff8c00; --preto: #050505; --card: #0f0f0f; --borda: #222; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { background: var(--preto); color: #fff; font-family: 'Inter', sans-serif; padding: 100px 20px; }
        
        .container { max-width: 600px; margin: 0 auto; background: var(--card); padding: 40px; border: 1px solid var(--borda); border-radius: 4px; }
        .title { font-family: 'Syncopate', sans-serif; font-size: 22px; color: var(--laranja); text-transform: uppercase; margin-bottom: 10px; text-align: center; }
        .subtitle { font-size: 12px; color: #888; text-align: center; margin-bottom: 30px; line-height: 1.6; }

        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: #666; margin-bottom: 8px; font-weight: 700; }
        .form-input, .form-select, .form-textarea { 
            width: 100%; background: #000; border: 1px solid var(--borda); color: #fff; 
            padding: 15px; font-size: 13px; outline: none; transition: 0.3s;
        }
        .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--laranja); }
        .form-textarea { resize: vertical; min-height: 100px; }

        .btn-submit { 
            width: 100%; background: var(--laranja); color: #000; border: none; padding: 15px; 
            font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; transition: 0.3s;
        }
        .btn-submit:hover { background: #fff; }
        
        .msg-sucesso { display: none; text-align: center; padding: 30px; border: 1px solid #4caf50; background: rgba(76, 175, 80, 0.1); margin-top: 20px; }
        .msg-sucesso h3 { color: #4caf50; margin-bottom: 10px; text-transform: uppercase; font-size: 14px; }
        .msg-sucesso p { font-size: 13px; color: #ccc; }
    </style>
</head>
<body>

    <div class="container" id="formContainer">
        <h1 class="title">Seu Saber no Quilombo</h1>
        <p class="subtitle">Preencha os dados abaixo. Seu ofício passará por uma análise de curadoria antes de ser exibido publicamente.</p>
        
        <form id="formCadastro" onsubmit="submeterSaber(event)">
            
            <div class="form-group">
                <label class="form-label">E-mail (Obrigatório ser o mesmo da filiação)</label>
                <input type="email" id="emailVerificacao" class="form-input" placeholder="seuemail@exemplo.com" required>
            </div>

            <div class="form-group">
                <label class="form-label">Nome Completo</label>
                <input type="text" id="filiadoNome" class="form-input" required>
            </div>

            <div class="form-group">
                <label class="form-label">Título do Trabalho / Ofício</label>
                <input type="text" id="tituloServico" class="form-input" placeholder="Ex: Designer de Interiores" required>
            </div>

            <div class="form-group">
                <label class="form-label">Território (Cidade SP)</label>
                <select id="cidade" class="form-select" required><option value="">Carregando...</option></select>
            </div>

            <div class="form-group">
                <label class="form-label">WhatsApp Comercial (Apenas Números)</label>
                <input type="text" id="whatsapp" class="form-input" placeholder="5512999999999" required>
            </div>

            <div class="form-group">
                <label class="form-label">Categoria Principal</label>
                <select id="categoriaSelect" class="form-select" onchange="loadSubcategorias(this.value)" required>
                    <option value="">Carregando...</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Subcategoria</label>
                <select id="subcategoriaSelect" class="form-select" required>
                    <option value="">Selecione a categoria primeiro...</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Resumo do Serviço</label>
                <textarea id="descricao" class="form-textarea" placeholder="Descreva seu trabalho, diferenciais e o que você oferece..." required></textarea>
            </div>

            <button type="submit" class="btn-submit" id="btnSalvar">Enviar para Análise</button>
        </form>
    </div>

    <div class="container msg-sucesso" id="msgSucesso">
        <h3>Cadastro Recebido com Sucesso!</h3>
        <p>Seu ofício foi enviado para a coordenação. Assim que aprovado, ele estará visível no Quilombo Digital.</p>
        <button class="btn-submit" style="margin-top: 20px;" onclick="window.location.reload()">Cadastrar Novo Saber</button>
    </div>

    <script>
        const CONFIG = {
            URL: 'https://huxemmuzhlntwimgiukt.supabase.co',
            KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh1eGVtbXV6aGxudHdpbWdpdWt0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3NzAyMDYsImV4cCI6MjA5MDM0NjIwNn0.Y85R3XQ9w4vMUGiH9zNmwpFpEj6jRPHc7lSjyYN_VVs'
        };
        const _supabase = supabase.createClient(CONFIG.URL, CONFIG.KEY);

        async function init() {
            // Carrega Cidades do IBGE
            const res = await fetch('https://servicodados.ibge.gov.br/api/v1/localidades/estados/SP/municipios');
            const cidades = await res.json();
            const selCidade = document.getElementById('cidade');
            selCidade.innerHTML = '<option value="">Selecione a cidade...</option>';
            cidades.forEach(c => selCidade.innerHTML += `<option value="${c.nome}">${c.nome}</option>`);

            // Carrega Categorias
            const { data } = await _supabase.from('unegro_categorias').select('*').order('nome');
            const selCat = document.getElementById('categoriaSelect');
            selCat.innerHTML = '<option value="">Selecione a Categoria...</option>';
            data.forEach(cat => selCat.innerHTML += `<option value="${cat.id}">${cat.nome}</option>`);
        }

        async function loadSubcategorias(catId) {
            const selSub = document.getElementById('subcategoriaSelect');
            if (!catId) { selSub.innerHTML = '<option value="">Selecione a categoria primeiro...</option>'; return; }
            
            const { data } = await _supabase.from('unegro_subcategorias').select('*').eq('categoria_id', catId).order('nome');
            selSub.innerHTML = '<option value="">Selecione a Subcategoria...</option>';
            data.forEach(sub => selSub.innerHTML += `<option value="${sub.id}">${sub.nome}</option>`);
        }

        async function submeterSaber(event) {
            event.preventDefault();
            const btn = document.getElementById('btnSalvar');
            const emailInput = document.getElementById('emailVerificacao').value;
            btn.innerText = 'Verificando Filiação...';

            // 1. CHECAGEM DE FILIAÇÃO (Chama a função RPC segura)
            const { data: isFiliado, error: rpcError } = await _supabase.rpc('check_filiado_ativo', { email_busca: emailInput });

            if (!isFiliado) {
                alert('Acesso negado. Este e-mail não consta na base de filiados da UNEGRO. Você será redirecionado para a página de afiliação.');
                window.location.href = 'https://www.unegro.online/';
                return;
            }

            btn.innerText = 'Enviando Dados...';

            // 2. INSERE OS DADOS (Com aprovado = false por padrão)
            const payload = {
                filiado_nome: document.getElementById('filiadoNome').value,
                titulo_servico: document.getElementById('tituloServico').value,
                cidade: document.getElementById('cidade').value,
                whatsapp: document.getElementById('whatsapp').value,
                categoria_id: document.getElementById('categoriaSelect').value,
                subcategoria_id: document.getElementById('subcategoriaSelect').value,
                descricao: document.getElementById('descricao').value,
                aprovado: false // Exigirá aprovação do admin
            };

            const { error } = await _supabase.from('unegro_servicos').insert([payload]);

            if (error) {
                alert('Erro ao processar o cadastro. Tente novamente mais tarde.');
                console.error(error);
                btn.innerText = 'Enviar para Análise';
            } else {
                document.getElementById('formContainer').style.display = 'none';
                document.getElementById('msgSucesso').style.display = 'block';
            }
        }

        window.onload = init;
    </script>
</body>
</html>
