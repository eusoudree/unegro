<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Territórios de Axé | UNEGRO Vale do Paraíba</title>
    
    <!-- Leaflet CSS & JS (Mapa) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- ScrollReveal -->
    <script src="https://unpkg.com/scrollreveal"></script>

    <style>
        :root {
            --laranja-solid: #ff8c00;
            --preto: #000000;
            --cinza-card: #0d0d0d;
            --texto: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--preto);
            color: var(--texto);
            font-family: 'Inter', sans-serif;
            background-image: linear-gradient(rgba(0,0,0,0.92), rgba(0,0,0,0.95)), 
            url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 100 100"><g fill="%23222" fill-opacity="0.3"><path d="M50 20 L40 35 H60 L50 20 M50 80 L60 65 H40 L50 80 M20 50 L35 40 V60 L20 50 M80 50 L65 60 V40 L80 50"/></g></svg>');
            background-attachment: fixed;
        }

        /* Navbar UNEGRO Vale do Paraíba */
        nav {
            position: fixed; top: 0; width: 100%; z-index: 1000;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,140,0,0.2); padding: 15px 0;
        }
        
        .nav-unegro { display: flex; justify-content: flex-end; padding: 25px 50px; background: transparent; }
        .nav-links { display: flex; gap: 40px; align-items: center; }
        .nav-links a, .dropbtn {
            color: rgba(255, 255, 255, 0.4); text-decoration: none; font-size: 11px;
            font-weight: 500; text-transform: uppercase; letter-spacing: 2px;
            background: none; border: none; cursor: pointer; transition: color 0.4s ease;
        }
        .nav-links a:hover, .dropdown:hover .dropbtn { color: #f1b434; }

        .nav-logo { display: flex; align-items: center; gap: 15px; position: absolute; left: 50px; top: 20px;}
        .nav-logo img { height: 50px; width: auto; }
        .nav-logo span { 
            color: #fff; 
            font-size: 10px; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            font-weight: 800;
            border-left: 1px solid #333;
            padding-left: 15px;
        }

        /* Container do Mapa FULL WIDTH */
        .container-mapeamento {
            padding: 140px 0 60px 0;
            max-width: 100%;
            margin: auto;
            text-align: center;
        }

        .secao-titulo { 
            color: var(--laranja-solid); 
            text-transform: uppercase; 
            letter-spacing: 5px; 
            margin-bottom: 10px; 
            font-size: 2.2rem; 
            font-weight: 900; 
        }

        #map {
            height: 65vh;
            width: 100%;
            border: none;
            border-top: 1px solid rgba(255, 140, 0, 0.2);
            border-bottom: 1px solid rgba(255, 140, 0, 0.2);
            z-index: 1;
            margin-top: 40px;
        }

        /* Customização dos Popups Leaflet */
        .leaflet-popup-content-wrapper {
            background: var(--cinza-card) !important;
            color: #fff !important;
            border: 1px solid var(--laranja-solid) !important;
            border-radius: 12px !important;
            padding: 5px !important;
        }
        .leaflet-popup-tip { background: var(--laranja-solid) !important; }

        .popup-label { color: var(--laranja-solid); font-size: 9px; text-transform: uppercase; font-weight: 800; }
        .popup-title { font-size: 18px; font-weight: 900; margin: 5px 0; text-transform: uppercase; color: #fff; }
        
        .popup-btn {
            display: block;
            background: var(--laranja-solid);
            color: #000;
            text-align: center;
            padding: 10px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 900;
            font-size: 11px;
            text-transform: uppercase;
            margin-top: 10px;
            transition: transform 0.2s ease;
        }
        .popup-btn:hover { transform: scale(1.02); }

        /* LAYOUT COM SIDEBAR */
        .layout-terreiros {
            display: flex;
            max-width: 1400px;
            margin: 0 auto 100px;
            padding: 0 50px;
            gap: 50px;
            align-items: flex-start;
        }

        /* SIDEBAR LATERAL */
        .sidebar-cidades {
            width: 250px;
            flex-shrink: 0;
            position: sticky;
            top: 120px;
            background: var(--cinza-card);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #1a1a1a;
        }
        .sidebar-titulo { color: var(--laranja-solid); font-family: 'Syncopate'; font-size: 12px; margin-bottom: 20px; letter-spacing: 2px;}
        .lista-cidades { list-style: none; display: flex; flex-direction: column; gap: 8px; }
        .lista-cidades li { 
            cursor: pointer; font-size: 12px; color: #aaa; transition: 0.3s; 
            padding: 10px 15px; border-radius: 6px; border: 1px solid transparent; 
            text-transform: uppercase; letter-spacing: 1px; font-weight: 600;
        }
        .lista-cidades li:hover { color: #fff; background: #111; }
        .lista-cidades li.ativo { color: #000; border-color: var(--laranja-solid); background: var(--laranja-solid); }

        .conteudo-lista { flex: 1; }

        .busca-container {
            margin-bottom: 40px;
        }
        .busca-input {
            width: 100%;
            padding: 18px 25px;
            background: var(--cinza-card);
            border: 1px solid rgba(255,140,0,0.3);
            border-radius: 8px;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        .busca-input:focus {
            border-color: var(--laranja-solid);
        }

        /* GRID SEM IMAGEM E COM MODAL */
        .grid-terreiros {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }
        .card-terreiro {
            background: var(--cinza-card);
            border: 1px solid #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s, border-color 0.3s;
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }
        .card-terreiro:hover {
            transform: translateY(-5px);
            border-color: var(--laranja-solid);
        }
        .card-content {
            padding: 30px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .card-city {
            color: var(--laranja-solid);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        .card-title {
            font-size: 18px;
            color: #fff;
            margin-bottom: 15px;
            font-weight: 900;
            line-height: 1.3;
        }
        .card-info {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 5px;
        }

        .paginacao {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 50px;
            flex-wrap: wrap;
        }
        .paginacao button {
            background: var(--cinza-card);
            color: #fff;
            border: 1px solid #333;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 600;
            transition: 0.3s;
        }
        .paginacao button:hover:not(:disabled) { border-color: var(--laranja-solid); color: var(--laranja-solid); }
        .paginacao button.active { background: var(--laranja-solid); color: #000; border-color: var(--laranja-solid); }
        .paginacao button:disabled { opacity: 0.5; cursor: not-allowed; }

        /* MODAL DE INFORMAÇÕES */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
            z-index: 2000; display: none; justify-content: center; align-items: center;
        }
        .modal-content {
            background: var(--cinza-card); border: 1px solid var(--laranja-solid);
            padding: 50px; border-radius: 12px; width: 90%; max-width: 500px;
            position: relative; max-height: 90vh; overflow-y: auto;
        }
        .modal-close {
            position: absolute; top: 20px; right: 25px; color: #fff;
            font-size: 28px; cursor: pointer; background: none; border: none; transition: 0.3s;
        }
        .modal-close:hover { color: var(--laranja-solid); }
        .modal-btn-wpp {
            background: #25D366; color: #fff; padding: 15px; border-radius: 6px;
            text-decoration: none; display: block; text-align: center;
            font-weight: 900; font-size: 11px; text-transform: uppercase; margin-top: 15px;
            transition: 0.3s;
        }
        .modal-btn-wpp:hover { background: #20b858; color: #fff; }

        footer { text-align: center; padding: 40px; color: #444; font-size: 0.8rem; }

        @media (max-width: 900px) {
            .nav-logo span { display: none; }
            .layout-terreiros { flex-direction: column; padding: 0 20px; }
            .sidebar-cidades { width: 100%; position: relative; top: 0; margin-bottom: 20px; }
        }

        @media (max-width: 768px) {
            .nav-unegro { padding: 15px 20px; }
            .nav-logo img { height: 40px; }
            .nav-links { gap: 15px; }
            .nav-links a { font-size: 9px; letter-spacing: 1px; }
            #map { height: 400px; }
            .secao-titulo { font-size: 1.5rem; }
            .modal-content { padding: 30px; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-logo">
            <img src="https://unegroes.org.br/wp-content/uploads/2024/12/UNEGRO-LOGO-e1734363397338.png" alt="UNEGRO">
            <span>Vale do Paraíba</span>
        </div>
        <div class="nav-unegro">
            <div class="nav-links">
                <a href="index.html">Início</a>
                <a href="quilombo.html">Quilombo Digital</a>
                <a href="terreiros.html" style="color: var(--laranja-solid);">Terreiros</a>
                <a href="portal.html">Área do Filiado</a>
            </div>
        </div>
    </nav>

    <div class="container-mapeamento">
        <h2 class="secao-titulo">Territórios de Axé</h2>
        <p style="color: #666; letter-spacing: 3px; text-transform: uppercase; font-size: 10px;">
            Mapeamento Ancestral • UNEGRO Vale do Paraíba
        </p>

        <div id="map"></div>
    </div>

    <!-- Layout Dividido: Sidebar e Lista -->
    <div class="layout-terreiros" id="secao-lista">
        
        <aside class="sidebar-cidades">
            <h3 class="sidebar-titulo">Cidades Mapeadas</h3>
            <ul class="lista-cidades" id="lista-cidades-sidebar">
                <!-- Cidades renderizadas via JS -->
            </ul>
        </aside>

        <section class="conteudo-lista">
            <div class="busca-container">
                <input type="text" id="input-busca" class="busca-input" placeholder="Buscar por nome do terreiro ou endereço..." oninput="lidarBusca(event)">
            </div>
            <div class="grid-terreiros" id="grid-terreiros">
                <!-- Cards rendered via JS -->
            </div>
            <div class="paginacao" id="paginacao-container">
                <!-- Pagination buttons rendered via JS -->
            </div>
        </section>

    </div>

    <!-- MODAL DO TERREIRO -->
    <div class="modal-overlay" id="modal-terreiro" onclick="fecharModalOverlay(event)">
        <div class="modal-content">
            <button class="modal-close" onclick="fecharModal()">×</button>
            <span class="card-city" id="modal-cidade"></span>
            <h3 class="card-title" id="modal-nome" style="font-size: 26px; margin-bottom: 25px;"></h3>
            <div id="modal-info"></div>
            <div id="modal-links" style="margin-top: 30px;"></div>
        </div>
    </div>

    <footer>UNEGRO VALE DO PARAÍBA • 2026</footer>

    <script>
        const CONFIG = {
            URL: 'https://huxemmuzhlntwimgiukt.supabase.co',
            KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh1eGVtbXV6aGxudHdpbWdpdWt0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3NzAyMDYsImV4cCI6MjA5MDM0NjIwNn0.Y85R3XQ9w4vMUGiH9zNmwpFpEj6jRPHc7lSjyYN_VVs'
        };
        const _supabase = supabase.createClient(CONFIG.URL, CONFIG.KEY);

        const map = L.map('map', { scrollWheelZoom: false }).setView([-23.18, -45.88], 9); 

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; UNEGRO Vale do Paraíba'
        }).addTo(map);

        let todosTerreiros = [];
        let terreirosFiltrados = [];
        let paginaAtual = 1;
        const itensPorPagina = 9; // Aumentado para 9 por página, já que não tem foto
        
        let termoBusca = '';
        let cidadeSelecionada = 'Todas';

        async function carregarTerreiros() {
            try {
                const { data, error } = await _supabase.from('unegro_terreiros').select('*');
                if (error) throw error;

                todosTerreiros = data || [];
                inicializarListaTerreiros(); 

                data.forEach(t => {
                    if (t.lat && t.lng) {
                        const marker = L.marker([t.lat, t.lng]).addTo(map);
                        const content = `
                            <div style="min-width: 220px; max-width: 280px; font-family: 'Inter', sans-serif;">
                                <span class="popup-label">${t.cidade || 'Vale do Paraíba'}</span>
                                <div class="popup-title">${t.nome}</div>
                                <div style="display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: #eee; margin-top: 5px;">
                                    ${t.zelador ? `<div><strong style="color:var(--laranja-solid)">Zelador(a):</strong> ${t.zelador}</div>` : ''}
                                </div>
                            </div>
                        `;
                        marker.bindPopup(content);
                    }
                });
            } catch (err) {
                console.error("Erro ao carregar dados do Supabase:", err.message);
            }
        }

        function inicializarListaTerreiros() {
            todosTerreiros.sort((a, b) => {
                const cityA = (a.cidade || '').toLowerCase();
                const cityB = (b.cidade || '').toLowerCase();
                if (cityA !== cityB) return cityA.localeCompare(cityB);
                return (a.nome || '').toLowerCase().localeCompare((b.nome || '').toLowerCase());
            });
            
            renderizarSidebarCidades();
            aplicarFiltros();
        }

        function renderizarSidebarCidades() {
            const cidades = [...new Set(todosTerreiros.map(t => t.cidade).filter(Boolean))].sort();
            const ul = document.getElementById('lista-cidades-sidebar');
            ul.innerHTML = `<li class="ativo" onclick="filtrarPorCidade('Todas', this)">Todas as Cidades</li>` + 
                cidades.map(c => `<li onclick="filtrarPorCidade('${c}', this)">${c}</li>`).join('');
        }

        function filtrarPorCidade(cidade, elemento) {
            document.querySelectorAll('#lista-cidades-sidebar li').forEach(li => li.classList.remove('ativo'));
            if(elemento) elemento.classList.add('ativo');
            
            cidadeSelecionada = cidade;
            aplicarFiltros();
        }

        function lidarBusca(event) {
            termoBusca = event.target.value.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            aplicarFiltros();
        }

        function aplicarFiltros() {
            terreirosFiltrados = todosTerreiros.filter(t => {
                const nome = (t.nome || '').toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                const endereco = (t.endereco || '').toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                
                const bateBusca = nome.includes(termoBusca) || endereco.includes(termoBusca);
                const bateCidade = cidadeSelecionada === 'Todas' || t.cidade === cidadeSelecionada;
                
                return bateBusca && bateCidade;
            });
            
            paginaAtual = 1;
            renderizarGridTerreiros();
        }

        function renderizarGridTerreiros() {
            const grid = document.getElementById('grid-terreiros');
            const inicio = (paginaAtual - 1) * itensPorPagina;
            const fim = inicio + itensPorPagina;
            const itensPaginados = terreirosFiltrados.slice(inicio, fim);

            if (itensPaginados.length === 0) {
                grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1; color:#888; padding: 40px;">Nenhum território encontrado com esses filtros.</p>';
            } else {
                grid.innerHTML = itensPaginados.map(t => {
                    const realIndex = todosTerreiros.indexOf(t);
                    return `
                    <div class="card-terreiro" onclick="abrirModal(${realIndex})">
                        <div class="card-content">
                            <span class="card-city">${t.cidade || 'Vale do Paraíba'}</span>
                            <h3 class="card-title">${t.nome}</h3>
                            ${t.zelador ? `<p class="card-info"><strong style="color: var(--laranja-solid);">Zelador(a):</strong> ${t.zelador}</p>` : ''}
                            ${t.endereco ? `<p class="card-info"><strong style="color: var(--laranja-solid);">Endereço:</strong> ${t.endereco}</p>` : ''}
                        </div>
                    </div>
                `}).join('');
            }
            renderizarPaginacao();
        }

        function abrirModal(index) {
            const t = todosTerreiros[index];
            document.getElementById('modal-cidade').innerText = t.cidade || 'Vale do Paraíba';
            document.getElementById('modal-nome').innerText = t.nome;
            
            let infoHtml = '';
            if(t.zelador) infoHtml += `<p class="card-info" style="font-size: 14px; margin-bottom: 8px;"><strong style="color: var(--laranja-solid);">Zelador(a):</strong> ${t.zelador}</p>`;
            if(t.endereco) infoHtml += `<p class="card-info" style="font-size: 14px; margin-bottom: 8px;"><strong style="color: var(--laranja-solid);">Endereço:</strong> ${t.endereco}</p>`;
            if(t.biografia) infoHtml += `<div style="margin-top: 25px; padding-top: 25px; border-top: 1px solid #222; font-size: 14px; color: #ccc; line-height: 1.6; font-style: italic;">"${t.biografia}"</div>`;
            document.getElementById('modal-info').innerHTML = infoHtml;

            let linksHtml = '';
            // Se houver uma coluna telefone, extrai os números para o link do WhatsApp
            if(t.telefone) {
                const numero = t.telefone.replace(/\D/g, '');
                linksHtml += `<a href="https://wa.me/55${numero}" target="_blank" class="modal-btn-wpp">Chamar no WhatsApp</a>`;
            }
            if(t.instagram_url) {
                linksHtml += `<a href="${t.instagram_url}" target="_blank" class="popup-btn">Ver Instagram Oficial</a>`;
            }
            document.getElementById('modal-links').innerHTML = linksHtml;

            document.getElementById('modal-terreiro').style.display = 'flex';
        }

        function fecharModal() {
            document.getElementById('modal-terreiro').style.display = 'none';
        }

        function fecharModalOverlay(event) {
            if (event.target.id === 'modal-terreiro') {
                fecharModal();
            }
        }

        function renderizarPaginacao() {
            const container = document.getElementById('paginacao-container');
            const totalPaginas = Math.ceil(terreirosFiltrados.length / itensPorPagina);
            
            if (totalPaginas <= 1) { container.innerHTML = ''; return; }

            let html = `<button ${paginaAtual === 1 ? 'disabled' : ''} onclick="mudarPagina(${paginaAtual - 1})">Anterior</button>`;
            for(let i = 1; i <= totalPaginas; i++) {
                html += `<button class="${paginaAtual === i ? 'active' : ''}" onclick="mudarPagina(${i})">${i}</button>`;
            }
            html += `<button ${paginaAtual === totalPaginas ? 'disabled' : ''} onclick="mudarPagina(${paginaAtual + 1})">Próximo</button>`;
            
            container.innerHTML = html;
        }

        function mudarPagina(pagina) {
            const totalPaginas = Math.ceil(terreirosFiltrados.length / itensPorPagina);
            if (pagina >= 1 && pagina <= totalPaginas) {
                paginaAtual = pagina;
                renderizarGridTerreiros();
                document.getElementById('secao-lista').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        ScrollReveal().reveal('.container-mapeamento', { delay: 200, distance: '50px', origin: 'bottom', opacity: 0 });
        ScrollReveal().reveal('.layout-terreiros', { delay: 400, distance: '50px', origin: 'bottom', opacity: 0 });
        
        window.onload = carregarTerreiros;
    </script>
</body>
</html>
