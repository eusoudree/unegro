<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Territórios de Axé | UNEGRO Vale do Paraíba</title>
    
    <!-- Leaflet CSS & JS (Mapa) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- ScrollReveal -->
    <script src="https://unpkg.com/scrollreveal"></script>

    <style>
        :root {
            --laranja-solid: #ff8c00;
            --preto: #000000;
            --cinza-card: #0d0d0d;
            --texto: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--preto);
            color: var(--texto);
            font-family: 'Inter', sans-serif;
            background-image: linear-gradient(rgba(0,0,0,0.92), rgba(0,0,0,0.95)), 
            url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 100 100"><g fill="%23222" fill-opacity="0.3"><path d="M50 20 L40 35 H60 L50 20 M50 80 L60 65 H40 L50 80 M20 50 L35 40 V60 L20 50 M80 50 L65 60 V40 L80 50"/></g></svg>');
            background-attachment: fixed;
        }

        /* Navbar UNEGRO Vale do Paraíba */
        .nav-unegro {
            display: flex;
            justify-content: space-between; 
            align-items: center;
            padding: 15px 50px;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(15px);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            border-bottom: 1px solid rgba(255,140,0,0.1);
        }

        .nav-logo { display: flex; align-items: center; gap: 15px; }
        .nav-logo img { height: 50px; width: auto; }
        .nav-logo span { 
            color: #fff; 
            font-size: 10px; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            font-weight: 800;
            border-left: 1px solid #333;
            padding-left: 15px;
        }

        .nav-links { display: flex; gap: 40px; align-items: center; }
        .nav-links a {
            color: rgba(255, 255, 255, 0.4);
            text-decoration: none;
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: color 0.4s ease;
        }
        .nav-links a:hover { color: var(--laranja-solid); }

        /* Container do Mapa */
        .container-mapeamento {
            padding: 160px 20px 60px;
            max-width: 1200px;
            margin: auto;
            text-align: center;
        }

        .secao-titulo { 
            color: var(--laranja-solid); 
            text-transform: uppercase; 
            letter-spacing: 5px; 
            margin-bottom: 10px; 
            font-size: 2.2rem; 
            font-weight: 900; 
        }

        #map {
            height: 600px;
            width: 100%;
            border-radius: 20px;
            border: 1px solid rgba(255, 140, 0, 0.2);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            z-index: 1;
            margin-top: 30px;
        }

        /* Popups */
        .leaflet-popup-content-wrapper {
            background: var(--cinza-card) !important;
            color: #fff !important;
            border: 1px solid var(--laranja-solid) !important;
            border-radius: 12px !important;
        }
        .leaflet-popup-tip { background: var(--laranja-solid) !important; }

        .popup-label { color: var(--laranja-solid); font-size: 9px; text-transform: uppercase; font-weight: 800; }
        .popup-title { font-size: 18px; font-weight: 900; margin: 5px 0; text-transform: uppercase; }
        .popup-btn {
            display: block;
            background: var(--laranja-solid);
            color: #000;
            text-align: center;
            padding: 10px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 900;
            font-size: 11px;
            text-transform: uppercase;
            margin-top: 10px;
        }

        footer { text-align: center; padding: 40px; color: #444; font-size: 0.8rem; }

        @media (max-width: 900px) {
            .nav-logo span { display: none; }
        }

        @media (max-width: 768px) {
            .nav-unegro { padding: 15px 20px; }
            .nav-logo img { height: 40px; }
            .nav-links { gap: 15px; }
            .nav-links a { font-size: 9px; letter-spacing: 1px; }
            #map { height: 400px; }
            .secao-titulo { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <nav class="nav-unegro">
        <div class="nav-logo">
            <img src="https://unegroes.org.br/wp-content/uploads/2024/12/UNEGRO-LOGO-e1734363397338.png" alt="Logo UNEGRO">
            <span>Vale do Paraíba</span>
        </div>
        <div class="nav-links">
            <a href="index.html">Início</a>
            <a href="filiados.html">Acesso Filiados</a>
            <a href="https://www.instagram.com/unegrovale" target="_blank">Instagram</a>
        </div>
    </nav>

    <div class="container-mapeamento">
        <h2 class="secao-titulo">Territórios de Axé</h2>
        <p style="color: #666; letter-spacing: 3px; text-transform: uppercase; font-size: 10px;">
            Mapeamento Ancestral • UNEGRO Vale do Paraíba
        </p>

        <div id="map"></div>
    </div>

    <footer>UNEGRO VALE DO PARAÍBA • 2026</footer>

    <script>
        const CONFIG = {
            URL: 'https://huxemmuzhlntwimgiukt.supabase.co',
            KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh1eGVtbXV6aGxudHdpbWdpdWt0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3NzAyMDYsImV4cCI6MjA5MDM0NjIwNn0.Y85R3XQ9w4vMUGiH9zNmwpFpEj6jRPHc7lSjyYN_VVs'
        };
        const _supabase = supabase.createClient(CONFIG.URL, CONFIG.KEY);

        const map = L.map('map', { scrollWheelZoom: false }).setView([-23.18, -45.88], 9); 

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; UNEGRO Vale do Paraíba'
        }).addTo(map);

        async function carregarTerreiros() {
            try {
                const { data, error } = await _supabase.from('unegro_terreiros').select('*');
                if (error) throw error;

                data.forEach(t => {
                    const marker = L.marker([t.lat, t.lng]).addTo(map);
                    const content = `
                        <div style="min-width: 180px;">
                            <span class="popup-label">${t.cidade}</span>
                            <div class="popup-title">${t.nome}</div>
                            <div style="font-size: 11px; color: #ccc;">Zelador(a): ${t.zelador}</div>
                            ${t.instagram_url ? `<a href="${t.instagram_url}" target="_blank" class="popup-btn">Instagram</a>` : ''}
                        </div>
                    `;
                    marker.bindPopup(content);
                });
            } catch (err) {
                console.error("Erro:", err.message);
            }
        }

        ScrollReveal().reveal('.container-mapeamento', { delay: 200, distance: '50px', origin: 'bottom', opacity: 0 });
        window.onload = carregarTerreiros;
    </script>
</body>
</html>
