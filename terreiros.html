<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Terreiros | UNEGRO Vale</title>
    
    <!-- Leaflet CSS (Mapa) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root { --gold: #f1b434; --black: #050505; --gray: #111; }
        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--black); color: white; }
        
        /* Layout */
        .container-mapa { display: flex; height: 100vh; flex-direction: column; }
        header { padding: 20px 40px; background: rgba(0,0,0,0.9); border-bottom: 1px solid var(--gold); display: flex; justify-content: space-between; align-items: center; }
        h1 { color: var(--gold); font-size: 1.2rem; text-transform: uppercase; letter-spacing: 2px; margin: 0; }

        /* O Mapa ocupando o resto da tela */
        #map { flex-grow: 1; width: 100%; z-index: 1; }

        /* Estilo do Popup do Mapa */
        .leaflet-popup-content-wrapper { background: var(--gray); color: white; border: 1px solid var(--gold); border-radius: 8px; }
        .leaflet-popup-tip { background: var(--gold); }
        .popup-title { color: var(--gold); font-weight: 800; font-size: 16px; margin-bottom: 5px; }
        .popup-info { font-size: 12px; line-height: 1.4; color: #ccc; }
        .popup-link { display: inline-block; margin-top: 10px; color: var(--gold); text-decoration: none; font-weight: bold; border: 1px solid var(--gold); padding: 5px 10px; border-radius: 4px; font-size: 10px; }

        .btn-voltar { color: #666; text-decoration: none; font-size: 12px; font-weight: bold; transition: 0.3s; }
        .btn-voltar:hover { color: var(--gold); }
    </style>
</head>
<body>

<div class="container-mapa">
    <header>
        <h1>Mapeamento de Comunidades Tradicionais e Terreiros</h1>
        <a href="index.html" class="btn-voltar">← VOLTAR AO SITE</a>
    </header>

    <div id="map"></div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    const CONFIG = {
        URL: 'https://huxemmuzhlntwimgiukt.supabase.co',
        KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh1eGVtbXV6aGxudHdpbWdpdWt0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3NzAyMDYsImV4cCI6MjA5MDM0NjIwNn0.Y85R3XQ9w4vMUGiH9zNmwpFpEj6jRPHc7lSjyYN_VVs'
    };
    const _supabase = supabase.createClient(CONFIG.URL, CONFIG.KEY);

    // 1. Inicializa o mapa centralizado no Vale do Paraíba
    const map = L.map('map').setView([-23.2237, -45.9009], 10); 

    // 2. Adiciona o estilo Dark do Mapa (CartoDB Dark Matter)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; UNEGRO Vale do Paraíba'
    }).addTo(map);

    // 3. Função para carregar terreiros do banco
    async function carregarTerreiros() {
        const { data, error } = await _supabase
            .from('unegro_terreiros')
            .select('*');

        if (error) return console.error(error);

        data.forEach(terreiro => {
            // Cria o marcador para cada terreiro
            const marker = L.marker([terreiro.lat, terreiro.lng]).addTo(map);

            // Conteúdo do balãozinho (Popup)
            const popupContent = `
                <div class="popup-title">${terreiro.nome}</div>
                <div class="popup-info">
                    <strong>Zelador(a):</strong> ${terreiro.zelador}<br>
                    <strong>Cidade:</strong> ${terreiro.cidade}<br>
                    <strong>Endereço:</strong> ${terreiro.endereco}
                </div>
                ${terreiro.instagram_url ? `<a href="${terreiro.instagram_url}" target="_blank" class="popup-link">INSTAGRAM</a>` : ''}
            `;

            marker.bindPopup(popupContent);
        });
    }

    window.onload = carregarTerreiros;
</script>

</body>
</html>
